plugins {
    id "com.android.application"
}

// The web app (everything outside android/) is copied in as assets/www.
def webRoot = rootProject.file("..")
def webOut = layout.buildDirectory.dir("generated/web")
tasks.register("copyWeb", Copy) {
    from(webRoot) {
        include "index.html", "manifest.webmanifest", "css/**", "js/**", "icons/**"
    }
    into webOut.map { it.dir("www") }
}

// Signing: CI passes the release key in through environment variables.
def keystorePath = System.getenv("LIFEOS_KEYSTORE")
def keystorePassword = System.getenv("LIFEOS_KEYSTORE_PASSWORD")

android {
    namespace "app.lifeos"
    compileSdk 34

    defaultConfig {
        applicationId "app.lifeos"
        minSdk 24
        targetSdk 34
        versionCode((System.getenv("LIFEOS_VERSION_CODE") ?: "1") as int)
        versionName System.getenv("LIFEOS_VERSION_NAME") ?: "1.0-dev"
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias "lifeos"
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    sourceSets {
        main.assets.srcDirs += webOut
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named("preBuild") { dependsOn "copyWeb" }

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
