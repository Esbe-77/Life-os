name: Android APK

# Builds the Android app on every push. With the signing key set up (see
# README), pushes to main publish a release, and pushes to other branches
# refresh the "preview" pre-release.

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.LIFEOS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lifeos.jks"
            echo "LIFEOS_KEYSTORE=$RUNNER_TEMP/lifeos.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The LIFEOS_KEYSTORE_BASE64 secret isn't set, so this APK uses a throwaway key and isn't published. See README."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: android
        env:
          LIFEOS_KEYSTORE_PASSWORD: ${{ secrets.LIFEOS_KEYSTORE_PASSWORD }}
          LIFEOS_VERSION_CODE: ${{ github.run_number }}
          LIFEOS_VERSION_NAME: 1.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Check the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk life-os.apk
          for f in index.html css/app.css js/app.js js/modules/index.js; do
            unzip -l life-os.apk "assets/www/$f" > /dev/null || { echo "::error::assets/www/$f is missing from the APK"; exit 1; }
          done
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs life-os.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: life-os-apk
          path: life-os.apk

      - name: Publish release
        if: steps.key.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" life-os.apk \
            --target "${{ github.sha }}" --title "Life OS 1.${{ github.run_number }}" --latest \
            --notes "Install or update by opening life-os.apk on your phone. Your data stays when you update."

      - name: Publish preview
        if: steps.key.outputs.signed == 'true' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview life-os.apk \
            --target "${{ github.sha }}" --prerelease --title "Life OS preview (1.${{ github.run_number }})" \
            --notes "Preview from branch ${{ github.ref_name }}. Install by opening life-os.apk on your phone."
